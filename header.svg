<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Yomna, backend developer and AI and data science learner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop class="g1" offset="0" />
      <stop class="g2" offset="1" />
    </radialGradient>
    <linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="390" y1="0" x2="610" y2="0">
      <stop class="r0" offset="0" />
      <stop class="r1" offset=".5" />
      <stop class="r0" offset="1" />
    </linearGradient>
  </defs>
  <style>
    .name   { font-family: Georgia, "Times New Roman", serif; font-size: 74px; font-weight: 400; letter-spacing: 1px; fill: #1f2328; }
    .role   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; letter-spacing: 4px; fill: #6e7781; }
    .status { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; letter-spacing: .3px; fill: #6e7781; }
    .g1 { stop-color: #f472b6; stop-opacity: .22; }
    .g2 { stop-color: #f472b6; stop-opacity: 0; }
    .r0 { stop-color: #f472b6; stop-opacity: 0; }
    .r1 { stop-color: #db2777; stop-opacity: 1; }
    .rule { stroke: url(#rule); stroke-width: 2; stroke-linecap: round; fill: none; }
    .dot  { fill: #ec4899; }
    @media (prefers-color-scheme: dark) {
      .name   { fill: #f6f8fa; }
      .role   { fill: #9198a1; }
      .status { fill: #9198a1; }
      .g1 { stop-color: #f9a8d4; stop-opacity: .20; }
      .g2 { stop-color: #f9a8d4; stop-opacity: 0; }
      .r0 { stop-color: #f9a8d4; stop-opacity: 0; }
      .r1 { stop-color: #f9a8d4; stop-opacity: 1; }
      .dot { fill: #f9a8d4; }
    }
    /* Everything is fully visible by default; animations play on top of that,
       so the header is never blank if a viewer ignores them. */
    .halo   { animation: fade 2s ease-out backwards; }
    .name   { animation: rise 1.2s ease-out .1s backwards; }
    .role   { animation: rise 1.2s ease-out .65s backwards; }
    .rule   { stroke-dasharray: 220; animation: draw 1.6s ease-out 1.1s backwards; }
    .status { animation: fade 1s ease-out 1.9s backwards; }
    .dot    { animation: fade 1s ease-out 1.9s backwards, breathe 3.2s ease-in-out 2.9s infinite; }
    @keyframes rise    { from { opacity: 0; transform: translateY(12px); } }
    @keyframes draw    { from { stroke-dashoffset: 220; } to { stroke-dashoffset: 0; } }
    @keyframes fade    { from { opacity: 0; } }
    @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  </style>

  <ellipse class="halo" cx="500" cy="100" rx="330" ry="86" fill="url(#glow)" />
  <text class="name" x="500" y="112" text-anchor="middle">Yomna</text>
  <text class="role" x="500" y="152" text-anchor="middle">BACKEND DEVELOPER  ·  AI &amp; DATA SCIENCE</text>
  <path class="rule" d="M390 182 H610" />
  <circle class="dot" cx="368" cy="217" r="4" />
  <text class="status" x="381" y="222">Open to internships  ·  Sousse, Tunisia</text>
</svg>
