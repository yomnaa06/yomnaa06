<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Yomna, backend developer and AI and data science learner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="380" y1="0" x2="620" y2="0">
      <stop class="r0" offset="0"/><stop class="r1" offset=".5"/><stop class="r0" offset="1"/>
    </linearGradient>
  </defs>
  <style>
    .name   { font-family: Georgia, "Times New Roman", serif; font-size: 74px; font-weight: 400; letter-spacing: 1px; fill: #1f2328; }
    .role   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; letter-spacing: 4px; fill: #57606a; }
    .status { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; letter-spacing: .3px; fill: #57606a; }
    .r0 { stop-color: #2563eb; stop-opacity: 0; }
    .r1 { stop-color: #2563eb; stop-opacity: 1; }
    .rule { stroke: url(#rule); stroke-width: 2; stroke-linecap: round; fill: none; }
    .eb { stroke: #64748b; stroke-width: 1; }
    .ef { stroke: #2563eb; stroke-width: 1.2; stroke-dasharray: 2 9; stroke-linecap: round; }
    .nd { fill: #2563eb; }
    .dot { fill: #16a34a; }
    @media (prefers-color-scheme: dark) {
      .name   { fill: #f6f8fa; }
      .role   { fill: #9198a1; }
      .status { fill: #9198a1; }
      .r0 { stop-color: #8ab4ff; stop-opacity: 0; }
      .r1 { stop-color: #8ab4ff; stop-opacity: 1; }
      .eb { stroke: #8b949e; }
      .ef { stroke: #8ab4ff; }
      .nd { fill: #8ab4ff; }
      .dot { fill: #3fb950; }
    }
    /* Everything is fully visible by default; animations play on top of that,
       so the header is never blank if a viewer ignores them. */
    .net    { animation: fade 2.2s ease-out .3s backwards; }
    .nd     { animation: pulse 5s ease-in-out infinite; }
    .ef     { animation: flow 7s linear infinite; }
    .name   { animation: rise 1.2s ease-out .1s backwards; }
    .role   { animation: rise 1.2s ease-out .65s backwards; }
    .rule   { stroke-dasharray: 240; animation: draw 1.6s ease-out 1.1s backwards; }
    .status { animation: fade 1s ease-out 1.9s backwards; }
    .dot    { animation: fade 1s ease-out 1.9s backwards, breathe 3.2s ease-in-out 2.9s infinite; }
    @keyframes rise   { from { opacity: 0; transform: translateY(12px); } }
    @keyframes draw   { from { stroke-dashoffset: 240; } to { stroke-dashoffset: 0; } }
    @keyframes fade   { from { opacity: 0; } }
    @keyframes flow   { to { stroke-dashoffset: -22; } }
    @keyframes pulse  { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
    @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  </style>

